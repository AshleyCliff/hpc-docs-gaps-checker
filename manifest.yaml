# Pinned inputs for the audit. This file is the reproducibility anchor:
# a run's result is a function of these SHAs and nothing else.
#
# SHAs are hand-pinned deliberately. Two runs against the same manifest are
# directly comparable, which is what makes "only new findings need review"
# possible. The cost is that upstream `main` moves invisibly -- so sync.py
# reports how far behind each pin is, and never silently re-pins.
#
# To bump a pin: run `sync.py --report-staleness`, review, then edit `ref`
# here in a deliberate commit. Never let tooling edit this file.
#
# Pinned 2026-10-21 from each repo's `main` head.
# (Previous pin set: 2026-09-16. charmed-hpc-terraform unchanged since.)

version: 1

defaults:
  branch: main # the branch staleness is measured against

repos:
