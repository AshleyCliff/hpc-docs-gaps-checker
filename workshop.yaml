name: docs-audit
base: ubuntu@24.04

sdks:
  # uv owns the mount plug only because a plug cannot be declared on the
  # `system` SDK. See "Workshop" in AGENTS.md.
  - name: uv
    plugs:
      inputs-plug:
        interface: mount
        workshop-target: /inputs
        read-only: true

  - name: opencode
    channel: latest/stable
    plugs:
        openrouter:
          interface: tunnel
          endpoint: localhost:8317
  - name: system
    slots:
      openrouter:
        interface: tunnel
        endpoint: localhost:8317

actions:
  # NOTE: sync is host-only. It creates and chmod a-w's the inputs tree, which
  # this container sees read-only. Run `extractors/sync.py --freeze` on the host.

  extract: |
    ./extractors/code_facts.py /inputs/repos > findings/code-facts.json
    ./extractors/doc_claims.py /inputs/repos/docs > findings/doc-claims.json
    ./extractors/diff.py findings/code-facts.json findings/doc-claims.json \
      > findings/deltas.json

  # render.py creates findings/run-<date>-<sha>/ itself and writes report.md and
  # findings.json into it, so there is no redirect here. See findings/README.md.
  # assert_clean.py takes the inputs tree root and appends repos/ itself.
  report: |
    ./extractors/render.py findings/
    ./extractors/assert_clean.py /inputs

  # OpenCode fetches its model catalogue from models.opencode.ai at startup.
  # This container is deliberately offline, so that fetch always fails -- and
  # OpenCode handles the failure fine PROVIDED it fails fast. Measured on
  # 2026-09-28, time from `init` to the logged fetch failure:
  #
  #   ~9.9s  ->  hangs forever   (LXD egress action=drop, no hosts pin)
  #   ~3.6s  ->  hangs forever   (egress action=reject, no hosts pin)
  #   ~0.6s  ->  proceeds to stream normally  (reject + hosts pin)
  #
  # Both halves are needed. This action applies the container half; the host
  # half cannot be committed and must be set once per machine:
  #
  #   lxc network set workshopbr0 security.acls.default.egress.action=reject
  #
  # Run once per container, and again after `workshop refresh` or a rebuild,
  # which discard the container filesystem. Idempotent. See "The models.dev
  # stall" in AGENTS.md.
  fix-catalogue-fetch: |
    grep -q 'models\.opencode\.ai' /etc/hosts || \
      echo "127.0.0.1 models.opencode.ai models.dev api.models.dev" | sudo tee -a /etc/hosts > /dev/null
    timeout 3 curl -sS -o /dev/null https://models.opencode.ai/api.json || test "$?" = "7"

  # Asserts the HOST half is still in place. A dropping bridge leaves curl
  # waiting until `timeout` kills it (rc=124); a rejecting one refuses in ~20ms
  # (rc=7). Checked separately because it lives outside the repo and so reverts
  # silently if the LXD ACL is ever rebuilt.
  check-egress: |
    timeout 3 curl -sS -o /dev/null https://github.com || test "$?" = "7"

  # Fails if the mount is missing or empty, which otherwise looks like
  # "no findings" rather than a broken run.
  check-mount: |
    test -d /inputs/repos || { echo "FAIL: /inputs/repos absent - remount?"; exit 1; }
    count=$(find /inputs/repos -mindepth 1 -maxdepth 1 -type d | wc -l)
    test "$count" -gt 0 || { echo "FAIL: /inputs/repos empty - remount?"; exit 1; }
    echo "OK: $count repo(s) at /inputs/repos"
    test -w /inputs && echo "WARN: /inputs is writable" || echo "OK: /inputs read-only"

  agent: opencode run "$@"
